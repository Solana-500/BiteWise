<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Download BiteWise</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="download-page">

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="nav-container">

            <a href="index.html" class="logo">
                BiteWise
            </a>

        </div>

    </header>


    <!-- DOWNLOAD CONTENT -->

    <main class="download-main">

        <div class="download-container">

            <!-- LEFT SIDE -->

            <div class="download-content">

                <div class="success-icon">
                    ✓
                </div>

                <p class="success-label">
                    ACCOUNT CREATED
                </p>

                <h1>
                    You're ready to start with BiteWise!
                </h1>

                <p class="download-description">
                    Download the BiteWise mobile app and log in with
                    your new account to start your nutrition journey.
                </p>


                <div class="download-buttons">

                <!-- APP STORE -->

                <a href="#" class="store-button">

                    <img
                        src="images/Apple_Store_logo.svg.webp"
                        alt=""
                        class="store-logo apple-logo"
                    >

                    <div class="store-text">
                        <span>Download on the</span>
                        <strong>App Store</strong>
                    </div>

                </a>


                <!-- GOOGLE PLAY -->

                <a href="#" class="store-button">

                    <img
                        src="images/Google_Play_2022_icon.svg.webp"
                        alt=""
                        class="store-logo google-logo"
                    >

                    <div class="store-text">
                        <span>GET IT ON</span>
                        <strong>Google Play</strong>
                    </div>

                </a>

            </div>


                <p class="prototype-note">
                    Mobile app download available soon.
                </p>


                <a href="index.html" class="back-home">
                    ← Back to BiteWise
                </a>

            </div>


            <!-- RIGHT SIDE / APP PREVIEW -->

            <div class="download-preview">

                <!-- Decorative circles -->
                <div class="download-circle download-circle-large"></div>
                <div class="download-circle download-circle-medium"></div>
                <div class="download-circle download-circle-small"></div>

                <!-- Decorative lines -->
                <div class="download-lines">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <!-- Phone -->
                <div class="download-phone">

                    <img
                        src="images/FuHomePage.jpg"
                        alt="BiteWise app preview"
                        id="download-preview-image"
                    >

                </div>

            </div>

        </div>

    </main>

    <script src="script.js"></script>
</body>

</html>
