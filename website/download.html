<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Download BiteWise</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="download-page">

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="nav-container">

            <a href="index.html" class="logo">
                BiteWise
            </a>

        </div>

    </header>


    <!-- DOWNLOAD CONTENT -->

    <main class="download-main">

        <div class="download-container">

            <!-- LEFT SIDE -->

            <div class="download-content">

                <div class="success-icon">
                    ✓
                </div>

                <p class="success-label" id="download-label">
                    GET THE APP
                </p>

                <h1 id="download-heading">
                    Download the BiteWise app
                </h1>

                <p class="download-description" id="download-description">
                    BiteWise is available on mobile. Download the app
                    and log in with your account to continue.
                </p>


                <div class="download-buttons">

                    <!-- Direct Android APK download; same original store-button styling -->
                    <a
                        href="https://github.com/Solana-500/BiteWise/releases/download/v1.0.0-beta/BiteWise.apk"
                        class="store-button"
                        aria-label="Download BiteWise Android APK"
                    >
                       

                        <div class="store-text">
                            <span>GET THE APK</span>
                            <strong>Download Android</strong>
                        </div>
                    </a>

                </div>


                <p class="prototype-note">
                    Android beta APK · Available after GitHub Release is published.
                </p>


                <a href="index.html" class="back-home">
                    ← Back to BiteWise
                </a>

            </div>


            <!-- RIGHT SIDE / APP PREVIEW -->

            <div class="download-preview">

                <!-- Decorative circles -->
                <div class="download-circle download-circle-large"></div>
                <div class="download-circle download-circle-medium"></div>
                <div class="download-circle download-circle-small"></div>

                <!-- Decorative lines -->
                <div class="download-lines">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <!-- Phone -->
                <div class="download-phone">

                    <img
                        src="images/FuHomePage.jpg"
                        alt="BiteWise app preview"
                        id="download-preview-image"
                    >

                </div>

            </div>

        </div>

    </main>

    <script>
        // Signup sends people here with ?welcome=1, so only they
        // see the "account created" wording. Anyone arriving from
        // login (or opening the page directly) sees the neutral text.

        if (new URLSearchParams(window.location.search).get("welcome") === "1") {

            document.getElementById("download-label").textContent =
                "ACCOUNT CREATED";

            document.getElementById("download-heading").textContent =
                "You're ready to start with BiteWise!";

            document.getElementById("download-description").textContent =
                "Download the BiteWise mobile app and log in with " +
                "your new account to start your nutrition journey.";

        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>

</html>
