<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | BiteWise</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body class="reset-password-page">

    <main class="reset-password-container">

        <div class="reset-password-card">

            <h1>Reset Password</h1>

            <p class="reset-password-description">
                Enter a new password for your BiteWise account.
            </p>

            <form id="reset-password-form">

                <div class="form-group">
                    <label for="new-password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="new-password"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-new-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-new-password"
                        placeholder="Confirm new password"
                        minlength="6"
                        required
                    >
                </div>

                <p
                    class="form-message reset-password-message"
                    id="reset-password-message"
                ></p>

                <button
                    type="submit"
                    class="reset-password-button"
                    id="reset-password-button"
                >
                    Reset Password
                </button>

            </form>

            <a
                href="index.html"
                class="return-login-link"
            >
                Return to Log In
            </a>

        </div>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- BiteWise JavaScript -->
    <script src="script.js"></script>

</body>

</html>
